<style>
/* Layout: sovelluskehys — yläpalkki roolin ja ajan vaihdolle, vasemmalla lista, oikealla työnäkymä. Sinetti = leimasinmuste. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eef0f5;
  --fg: #1b1f2a;
  --muted: #5a6172;
  --line: #d9dce4;

  --ink-soft: #e7e7f6;
  --on-ink: #ffffff;
  --ok: #1f7a4d;   --ok-soft: #e3f3ea;
  --warn: #9a5b00; --warn-soft: #fbefd9;
  --bad: #b3261e;  --bad-soft: #fbe6e4;
  --shadow: 0 1px 2px rgba(20, 24, 40, .06), 0 4px 16px rgba(20, 24, 40, .05);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141b; --surface: #1a1d27; --surface-2: #232736; --fg: #e8eaf1; --muted: #a0a6b8; --line: #2f3446;
    --ink: #a9abff; --ink-soft: #2a2c55; --on-ink: #12141b;
    --ok: #6fd3a0; --ok-soft: #173a2a; --warn: #f2bb5c; --warn-soft: #3b2c10; --bad: #ff8f86; --bad-soft: #42201d;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141b; --surface: #1a1d27; --surface-2: #232736; --fg: #e8eaf1; --muted: #a0a6b8; --line: #2f3446;
  --ink: #a9abff; --ink-soft: #2a2c55; --on-ink: #12141b;
  --ok: #6fd3a0; --ok-soft: #173a2a; --warn: #f2bb5c; --warn-soft: #3b2c10; --bad: #ff8f86; --bad-soft: #42201d;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--f-body); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: 1.75rem; font-weight: 700; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Yläpalkki */
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top-inner { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; }
.tag { font-size: .7rem; padding: 2px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-weight: 600; letter-spacing: .03em; }
.switch { display: flex; flex-direction: column; gap: 3px; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }

.notice { max-width: 1240px; margin: 12px auto 0; padding: 0 16px; }
.notice p { font-size: .85rem; color: var(--muted); }

/* Runko */
.app { max-width: 1240px; margin: 0 auto; padding: 16px 16px 48px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.side { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tender-item { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; }
.tender-item[aria-current="true"] { border-color: var(--ink); background: var(--ink-soft); }
.tender-item .t { font-weight: 700; display: block; }
.tender-item .meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }

.main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.section { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: .8rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.open { background: var(--ok-soft); color: var(--ok); }

.pill.warn { background: var(--warn-soft); color: var(--warn); }

.steps li { counter-increment: s; font-size: .8rem; color: var(--muted); border-top: 3px solid var(--line); padding-top: 6px; }
.steps li::before { content: counter(s) ". "; font-family: var(--f-mono); }
.steps li.done { border-color: var(--ink); color: var(--fg); }
.steps li.now { border-color: var(--ink); color: var(--ink); font-weight: 700; }

.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px 20px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }

.files { display: flex; flex-wrap: wrap; gap: 8px; }
.file { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: .875rem; background: var(--surface-2); }

/* Sinetti */
.sealed { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; padding: 18px; border: 1.5px dashed var(--ink); border-radius: var(--r); background: var(--ink-soft); }
.seals { display: flex; }
.seal { width: 46px; height: 46px; border-radius: 50%; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; border: 3px solid var(--ink-soft); margin-left: -12px; box-shadow: var(--shadow); }
.seal:first-child { margin-left: 0; }
.countdown { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; color: var(--ink); }
@media (max-width: 520px) { .sealed { grid-template-columns: minmax(0, 1fr); } }

/* Painikkeet */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: .9rem; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 5px 10px; font-size: .8rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Vertailu */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: .9rem; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { background: var(--surface-2); font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); position: sticky; top: 0; }
th.r, td.r { text-align: right; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.chosen { background: var(--ok-soft); }
.best { display: inline-block; font-size: .7rem; font-weight: 700; color: var(--ok); background: var(--ok-soft); padding: 1px 6px; border-radius: 4px; margin-top: 3px; }
.co { font-weight: 700; }

/* Lomake */
form { display: flex; flex-direction: column; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: .9rem; }
label .hint { font-weight: 400; color: var(--muted); font-size: .8rem; }
input[type=text], input[type=date], input[type=number], textarea, select { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); width: 100%; font-weight: 400; }
input:disabled, textarea:disabled { background: var(--surface-2); color: var(--muted); }

.check { flex-direction: row; align-items: flex-start; gap: 8px; font-weight: 400; }
.check input { margin-top: 4px; }
.sum { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 12px 14px; background: var(--surface-2); border-radius: 8px; font-size: .9rem; }
.sum .total { font-weight: 700; border-top: 1px solid var(--line); padding-top: 6px; }
.privacy { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--ink-soft); font-size: .875rem; }
.privacy svg { flex: none; margin-top: 2px; color: var(--ink); }

.qa { display: flex; flex-direction: column; gap: 10px; }
.q { border-left: 3px solid var(--line); padding-left: 12px; }
.q .a { margin-top: 4px; color: var(--muted); }

.toast { padding: 10px 14px; border-radius: 8px; background: var(--ok-soft); color: var(--ok); font-weight: 600; font-size: .9rem; }
.confirm { padding: 14px; border: 1px solid var(--ink); border-radius: 8px; background: var(--ink-soft); display: flex; flex-direction: column; gap: 10px; }

/* Yhteenveto hallitukselle */
.memo { border: 1px solid var(--line); border-radius: 6px; padding: 22px 24px; background: var(--surface); display: flex; flex-direction: column; gap: 12px; font-size: .92rem; }
.memo h3 { font-size: 1.05rem; }
.memo ol { margin: 0; padding-left: 20px; }

.log { font-family: var(--f-mono); font-size: .8rem; display: flex; flex-direction: column; gap: 4px; }
.log div { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 10px; }

/* Välilehdet */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { border: 0; background: transparent; padding: 8px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs .count { font-family: var(--f-mono); font-size: .75rem; margin-left: 4px; }

/* Hankekansio */
.folder { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .folder { grid-template-columns: minmax(0, 1fr); } }
.progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
.phase { display: flex; flex-direction: column; gap: 2px; }
.phase h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 6px 0 4px; display: flex; justify-content: space-between; }
.task { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; align-items: start; padding: 6px 8px; border-radius: 6px; font-size: .9rem; text-align: left; border: 0; background: transparent; width: 100%; }
button.task:hover { background: var(--surface-2); }
.task[aria-current="true"] { background: var(--ink-soft); }
.task .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); margin-top: 3px; display: grid; place-items: center; }
.task.done .dot { background: var(--ok); border-color: var(--ok); }
.task.done .dot::after { content: ""; width: 6px; height: 3px; border: solid var(--surface); border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }

.task .sub { display: block; font-size: .78rem; color: var(--muted); }
.task .doclink { color: var(--ink); font-weight: 600; }

.paper { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); padding: 34px 40px 40px; max-width: 760px; width: 100%; font-size: .95rem; line-height: 1.6; display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 600px) { .paper { padding: 22px 18px; } }
.paper-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 20px; border-bottom: 1px solid var(--line); padding-bottom: 12px; font-size: .85rem; }

.paper ol, .paper ul { margin: 0; padding-left: 22px; }
.paper table { min-width: 0; font-size: .88rem; }
.paper [contenteditable]:focus { outline: 1px dashed var(--ink); outline-offset: 6px; }
.fill { background: var(--ink-soft); border-bottom: 1px dashed var(--ink); padding: 0 2px; border-radius: 2px; }

.callout { display: flex; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--fg); font-size: .875rem; }

/* Ohjattu luonti */
.wizard-steps { display: flex; flex-wrap: wrap; gap: 6px; }
.wizard-steps span { font-size: .8rem; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-weight: 600; }
.wizard-steps span.on { background: var(--ink); color: var(--on-ink); }
.types { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.types button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px; font-weight: 600; font-size: .9rem; }
.types button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink-soft); }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 18px; text-align: center; color: var(--muted); font-size: .9rem; }

@media (prefers-reduced-motion: no-preference) {
  .main > * { animation: rise .25s ease-out both; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = n => new Intl.NumberFormat('fi-FI', { maximumFractionDigits: 0 }).format(Math.round(n)) + ' €';
const pressed = (seg, attr, val) => document.querySelectorAll(`#${seg} button`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset[attr] === String(val))));

function phaseOf(t) {
  if (t.status === 'draft') return ['Luonnos', 'draft'];
  if (t.status === 'awarded') return ['Urakoitsija valittu', 'done'];
  if (S.chosen) return ['Urakoitsija valittu', 'done'];
  return S.after ? ['Tarjoukset avattu', 'eval'] : ['Tarjousaika käynnissä', 'open'];
}
function stepIndex(t) {
  if (t.status === 'draft') return 0;
  if (t.status === 'awarded' || S.chosen) return 3;
  return S.after ? 2 : 1;
}
const steps = t => {
  const i = stepIndex(t);
  return `<ol class="steps">${['Luonnos', 'Tarjousaika', 'Tarjoukset avattu', 'Urakoitsija valittu'].map((s, n) => `<li class="${n < i ? 'done' : n === i ? 'now' : ''}">${s}</li>`).join('')}</ol>`;
};

    <div class="head-row"><div><p class="eyebrow">Hankekansio · ${esc(t.company)}</p><h1>${esc(t.title)}</h1></div><span class="small muted num">${done}/${all.length} tehtävää valmiina</span></div>

    <div class="folder"><nav aria-label="Hankkeen vaiheet">${list}</nav>
      <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
        <div class="doc-tools"><div class="legend"><span>${F('Korostettu')} täytetty kilpailutuksen tiedoista</span><span>${F('Keltainen', true)} täydentyy myöhemmin</span></div>
          <div class="actions"><button class="btn small" disabled title="Valmiissa palvelussa">Lataa PDF</button><button class="btn small" disabled title="Valmiissa palvelussa">Lataa Word</button></div></div>
        ${docView(t)}
        <div class="callout"><span><strong>Vastuuraja.</strong> Asiakirjat ovat pohjia, eivät suunnittelijan suunnitelmia. Ikkunaremontissa pohjat yleensä riittävät. Tarkista kunnan rakennusvalvonnasta, tarvitaanko lupa tai ilmoitus, jos julkisivun ulkonäkö muuttuu. Julkisivu-, parveke- ja putkiremonteissa tarvitaan aina suunnittelija ja valvoja.</span></div>
      </div></div>
  </section>`;
}

function paper(title, no, body) {
  return `<article class="paper">
    <div class="paper-head"><span><strong>As Oy Koivukallion Rinne</strong><br>Y-tunnus 0123456-7</span><span style="text-align:right">${no}<br>Päiväys 13.10.2026</span>
      <span class="doc-title">${title}</span></div>
    <div contenteditable="true" spellcheck="false" style="display:flex;flex-direction:column;gap:12px" aria-label="${esc(title)}, muokattava teksti">${body}</div>
    <p class="small muted" contenteditable="false">Voit muokata tekstiä suoraan. Esikatselussa muutokset eivät tallennu.</p></article>`;
}

function docView(t) {
  const cb = S.chosen ? bids.find(b => b.id === S.chosen) : null;
  const co = cb ? F(esc(cb.co)) : F('[urakoitsija valitaan tarjousten avauduttua]', true);
  if (S.doc === 'urakka') return paper('Urakkaohjelma', '1 (2)', `
    <h4>1. Tilaaja ja kohde</h4>
    <p>Tilaaja on ${F('As Oy Koivukallion Rinne')} (${F('0123456-7')}), ${F('Koivukalliontie 14, 01360 Vantaa')}. Tilaajaa edustaa isännöitsijä ${F('Mari Virtanen')}. Kohteessa on ${F('3 porrasta ja 48 asuntoa')}, rakennusvuosi ${F('1978')}.</p>
    <h4>2. Urakan laajuus</h4>
    <p>Urakkaan kuuluu ${F('212 ikkunan ja 48 parvekeoven')} uusiminen työselityksen mukaisesti: vanhojen ikkunoiden purku ja kierrätys, uusien asennus, tiivistys, ikkunapenkkien uusiminen sekä sisä- ja ulkopuoliset listoitukset ja pellitykset.</p>
    <h4>3. Urakkamuoto ja sopimusehdot</h4>
    <p>Kokonaishintainen urakka. Sopimukseen sovelletaan rakennusurakan yleisiä sopimusehtoja YSE 1998.</p>
    <h4>4. Aikataulu</h4>
    <p>Työt alkavat aikaisintaan ${F('1.5.2027')} ja ovat valmiit viimeistään ${F('31.8.2027')}. Työt tehdään porras kerrallaan. Huoneistossa työ saa kestää enintään kaksi työpäivää.</p>
    <h4>5. Maksuerät, vakuudet ja takuu</h4>
    <p>Maksut työvaiheiden mukaisen maksuerätaulukon perusteella. Viimeinen erä, vähintään 10 % urakkahinnasta, maksetaan hyväksytyn vastaanoton jälkeen. Rakennusaikainen vakuus 10 % ja takuuajan vakuus 2 % urakkahinnasta. Takuuaika vähintään 24 kuukautta tai tarjouksessa ilmoitettu pidempi aika.</p>
    <h4>6. Tilaajavastuu</h4>
    <p>Urakoitsija toimittaa tilaajavastuulain mukaiset selvitykset ennen urakkasopimuksen allekirjoittamista ja pitää ne ajan tasalla urakan ajan.</p>
    <h4>7. Tarjousten vertailu</h4>
    <p>Tarjouksista valitaan kokonaistaloudellisesti edullisin. Painotukset: hinta ${F('70 %')}, takuuaika ${F('10 %')}, aikataulu ${F('10 %')}, referenssit ${F('10 %')}.</p>
    <h4>8. Tarjousten jättäminen</h4>
    <p>Tarjoukset jätetään Sinetti-palvelussa viimeistään ${F(DEADLINE)}. Kysymykset esitetään palvelussa, ja vastaukset näkyvät kaikille tarjoajille.</p>
    <h4>9. Liitteet</h4>
    <ol><li>${F('Kuntoarvio 2025')}</li><li>${F('Ikkunakaaviot A–C')}</li><li>Työselitys</li><li>Tarjouslomake</li></ol>`);

  if (S.doc === 'asukas') return paper('Asukastiedote: ikkunaremontti alkaa', '1 (1)', `
    <p>Hyvä asukas,</p>
    <p>taloyhtiössämme uusitaan kaikki ikkunat ja parvekeovet. Urakoitsijana toimii ${co}. Työt tehdään porras kerrallaan alla olevan aikataulun mukaan.</p>
    <div class="table-wrap"><table><thead><tr><th>Porras</th><th>Työviikot</th><th>Huoneistokohtainen aika</th></tr></thead><tbody>
      <tr><td>A</td><td style="white-space:nowrap">${cb ? F('viikot 19–21') : F('[aikataulu]', true)}</td><td rowspan="3">Saat oman päivämäärän lappuna oveen viimeistään viikkoa ennen.</td></tr>
      <tr><td>B</td><td style="white-space:nowrap">${cb ? F('viikot 22–24') : F('[aikataulu]', true)}</td></tr>
      <tr><td>C</td><td style="white-space:nowrap">${cb ? F('viikot 25–27') : F('[aikataulu]', true)}</td></tr></tbody></table></div>
    <h4>Mitä sinun pitää tehdä</h4>
    <ul><li>Siirrä huonekalut noin 1,5 metrin päähän ikkunoista.</li><li>Irrota verhot, kaihtimet ja ikkunalaudoilla olevat tavarat.</li><li>Suojaa herkät tavarat pölyltä.</li><li>Jos et ole kotona, toimita avain isännöitsijälle. Kerro lemmikeistä etukäteen.</li></ul>
    <h4>Työpäivän aikana</h4>
    <p>Työt tehdään arkisin klo 7–16. Asunnossa voi olla kylmää ja meluisaa muutaman tunnin ajan, kun ikkuna on poissa.</p>
    <h4>Yhteystiedot</h4>
    <p>Vastaava työnjohtaja: ${cb ? F('[nimi ja puhelin sopimuksesta]', true) : F('[täydentyy sopimuksesta]', true)}<br>Isännöitsijä: ${F('Mari Virtanen')}</p>
    <p>Ystävällisin terveisin<br>Hallitus</p>`);

  if (S.doc === 'hanke') return paper('Hankesuunnitelma', '1 (2)', `
    <h4>Tausta</h4>
    <p>Kuntoarvion ${F('2025')} mukaan ikkunat ja parvekeovet ovat alkuperäiset vuodelta ${F('1978')}. Puitteissa on lahovaurioita, ja tiivisteet ovat käyttöikänsä lopussa. Uusiminen on kunnossapitosuunnitelmassa vuosille ${F('2026–2027')}.</p>
    <h4>Tavoitteet</h4>
    <ul><li>Uudet ikkunat ja parvekeovet, U-arvo enintään ${F('1,0')}</li><li>Pienempi lämmitysenergian kulutus ja vedottomammat asunnot</li><li>Huoneistossa työ enintään kaksi työpäivää</li></ul>
    <h4>Kustannusarvio</h4>
    <p>${F('380 000–460 000 €')} alv 0 %, eli ${F('476 900–577 300 €')} sis. alv 25,5 %. Asuntoa kohden noin ${F('9 900–12 000 €')}, jaetaan yhtiöjärjestyksen mukaisesti osakkeiden perusteella.</p>
    ${S.after ? `<p><strong>Tarjousten perusteella:</strong> ${F('386 500–449 900 €')} alv 0 %. Edullisin tarjous alittaa arvion ylärajan.</p>` : ''}
    <h4>Rahoitus</h4>
    <p>Taloyhtiö ottaa ${F('15 vuoden')} lainan, jonka lyhennykset katetaan rahoitusvastikkeella. Osakas voi maksaa osuutensa kerralla ennen lainan nostoa.</p>
    <h4>Päätöksenteko ja aikataulu</h4>
    <ol><li>Osakkaille tiedotetaan ja heille varataan tilaisuus esittää näkemyksensä.</li><li>Yhtiökokous päättää kilpailutuksesta.</li><li>Kilpailutus Sinetti-palvelussa, tarjoukset ${F(DEADLINE)}.</li><li>Hallitus tai yhtiökokous valitsee urakoitsijan.</li><li>Työt ${F('touko–elokuu 2027')}.</li></ol>`);

  const desc = { osakas: 'Kertoo osakkaille suunnitellusta remontista, kustannusarviosta ja vastikevaikutuksesta sekä siitä, miten ja mihin mennessä osakas voi esittää näkemyksensä.',
    tyoselitys: 'Tekniset vaatimukset: ikkunatyyppi, U-arvo, lasitus, helat, ääneneristys, purku, liittymät ja pellitykset. Pohja on ikkunaremonttia varten tarkistettu.',
    sopimus: 'Urakkasopimus YSE 1998 -ehdoin. Hinta, aikataulu, takuu ja maksuerät täyttyvät valitusta tarjouksesta.',
    vastaanotto: 'Pöytäkirja vastaanottotarkastukseen: osapuolet, tarkastetut huoneistot, virheet ja puutteet korjausaikoineen sekä takuuajan alkaminen.' };
  return `<article class="paper"><div class="paper-head"><span><strong>As Oy Koivukallion Rinne</strong></span><span></span><span class="doc-title">${esc(DOCS[S.doc])}</span></div>
    <p>${esc(desc[S.doc])}</p><p class="small muted">Esikatselussa on täytettynä kolme asiakirjaa: hankesuunnitelma, urakkaohjelma ja asukastiedote. Valitse jokin niistä vasemmalta.</p></article>`;
}

/* ---------- Urakoitsija ---------- */
function contractorView() {
  const t = tenders[0], d = S.bidDraft, p = parseFloat(String(d.price).replace(/\s/g, '').replace(',', '.')) || 0;
  const locked = S.after;
  const status = S.after
    ? (S.chosen ? (S.chosen === 'a' ? '<span class="pill done">Tarjouksesi valittiin</span>' : '<span class="pill draft">Taloyhtiö valitsi toisen urakoitsijan</span>') : '<span class="pill eval">Tarjousaika päättynyt · odottaa taloyhtiön päätöstä</span>')
    : (S.myBid ? '<span class="pill open">Tarjous jätetty · voit muokata määräpäivään asti</span>' : '<span class="pill warn">Ei vielä tarjousta</span>');
  return `<section class="panel section">
    <div class="head-row"><div><p class="eyebrow">${esc(t.type)} · Vantaa</p><h1>${esc(t.title)}</h1></div>${status}</div>
    <dl class="facts"><div><dt>Tarjoukset viimeistään</dt><dd>${DEADLINE}</dd></div><div><dt>Kohde</dt><dd>${esc(t.address)}</dd></div><div><dt>Laajuus</dt><dd>${esc(t.size)}</dd></div><div><dt>Toivottu aikataulu</dt><dd>${t.start} – ${t.end}</dd></div></dl>
    <div><p class="eyebrow" style="margin-bottom:6px">Liitteet</p><div class="files">${t.files.map(f => `<span class="file">${ICON.file}${esc(f)}</span>`).join('')}</div></div>
  </section>
  <section class="panel section"><h2>Tarjouksesi</h2>
    <div class="privacy">${ICON.shield}<p>Taloyhtiö näkee tarjouksesi vasta ${DEADLINE}. Muut urakoitsijat eivät näe sitä koskaan, eikä palvelun ylläpitäjä näe sitä ennen määräpäivää.</p></div>
    ${S.toast ? `<p class="toast">${esc(S.toast)}</p>` : ''}
    <form id="bidForm">
      <div class="grid2">
        <label for="b-price">Urakkahinta alv 0 % (€)<input id="b-price" type="text" inputmode="decimal" value="${esc(d.price)}" ${locked ? 'disabled' : ''}></label>
        <label for="b-war">Takuu (kuukautta)<input id="b-war" type="number" min="0" max="240" value="${esc(d.warranty)}" ${locked ? 'disabled' : ''}></label>
        <label for="b-start">Aloitus<input id="b-start" type="date" value="${esc(d.start)}" ${locked ? 'disabled' : ''}></label>
        <label for="b-end">Valmistuminen<input id="b-end" type="date" value="${esc(d.end)}" ${locked ? 'disabled' : ''}></label>
      </div>
      <div class="sum"><span>Hinta alv 0 %</span><span class="num" id="s0">${eur(p)}</span><span>Arvonlisävero 25,5 %</span><span class="num" id="s1">${eur(p * VAT)}</span><span class="total">Yhteensä</span><span class="num total" id="s2">${eur(p * (1 + VAT))}</span></div>
      <label for="b-note">Tarjouksen sisältö<span class="hint">Tuotteet, työn laajuus, mitä hintaan sisältyy ja mitä ei.</span><textarea id="b-note" ${locked ? 'disabled' : ''}>${esc(d.note)}</textarea></label>
      <label for="b-refs">Referenssit<textarea id="b-refs" style="min-height:60px" ${locked ? 'disabled' : ''}>${esc(d.refs)}</textarea></label>
      <label class="check" for="b-tv"><input id="b-tv" type="checkbox" ${d.tv ? 'checked' : ''} ${locked ? 'disabled' : ''}><span>Liitä yrityksen tilaajavastuuasiakirjat profiilista (päivitetty 2.10.2026)</span></label>
      <div class="actions">${locked ? '<button class="btn" type="button" disabled>Tarjousaika päättynyt</button>' : `<button class="btn primary" type="submit">${S.myBid ? 'Päivitä tarjous' : 'Jätä tarjous'}</button>${S.myBid ? '<button class="btn" type="button" data-act="withdraw">Peru tarjous</button>' : ''}`}</div>
    </form>
  </section>
  <section class="panel section"><h2>Kysymykset ja vastaukset</h2>
    <div class="qa">${qa.map(x => `<div class="q"><p><strong>${esc(x.q)}</strong> <span class="small muted">${x.when}</span></p><p class="a">${esc(x.a)}</p></div>`).join('')}${S.asked ? '<div class="q"><p><strong>Onko kohteessa asbestikartoitus?</strong></p><p class="a"><span class="pill warn">Odottaa vastausta</span></p></div>' : ''}</div>
    ${S.after ? '' : `<form id="askForm"><label for="ask">Kysy taloyhtiöltä<span class="hint">Nimesi ei näy muille. Vastaus näytetään kaikille tarjoajille.</span><input id="ask" type="text" value="Onko kohteessa asbestikartoitus?"></label><div class="actions"><button class="btn" type="submit" ${S.asked ? 'disabled' : ''}>Lähetä kysymys</button></div></form>`}
  </section>`;
}

/* ---------- Ylläpitäjä ---------- */
function adminView() {
  return `<section class="panel section"><h1>Kaikki kilpailutukset</h1>
    <div class="table-wrap"><table style="min-width:600px"><thead><tr><th>Kilpailutus</th><th>Taloyhtiö</th><th>Vaihe</th><th class="r">Tarjouksia</th><th>Tarjousten sisältö</th></tr></thead><tbody>
    ${tenders.map(t => { const [l, c] = phaseOf(t); const n = t.status === 'live' ? 3 : t.status === 'awarded' ? 4 : 0;
      const content = t.status === 'draft' ? '<span class="muted">–</span>' : (t.status === 'live' && !S.after) ? `<span class="pill eval">${'Sinetöity 20.11. asti'}</span>` : '<button class="btn small">Näytä (kirjataan lokiin)</button>';
      return `<tr><td class="co">${esc(t.title)}</td><td>${esc(t.company)}</td><td><span class="pill ${c}">${l}</span></td><td class="r num">${n}</td><td>${content}</td></tr>`; }).join('')}
    </tbody></table></div></section>
    <section class="panel section"><h2>Tapahtumaloki · Ikkunoiden ja parvekeovien uusiminen</h2><p class="small muted">Kuka teki mitä ja milloin. Tarjousten sisältöä lokiin ei tallenneta.</p>
    <div class="log">
      <div><span class="muted">13.10. 09.12</span><span>Mari Virtanen julkaisi kilpailutuksen</span></div>
      <div><span class="muted">21.10. 14.40</span><span>Urakoitsija jätti tarjouksen (#1)</span></div>
      <div><span class="muted">30.10. 08.05</span><span>Urakoitsija jätti tarjouksen (#2)</span></div>
      <div><span class="muted">6.11. 16.31</span><span>Urakoitsija päivitti tarjouksensa (#1)</span></div>
      <div><span class="muted">12.11. 10.02</span><span>Urakoitsija jätti tarjouksen (#3)</span></div>
      ${S.after ? '<div><span class="muted">20.11. 12.00</span><span>Tarjousaika päättyi, tarjoukset avautuivat</span></div><div><span class="muted">20.11. 12.14</span><span>Mari Virtanen avasi tarjoukset</span></div>' : ''}
      ${S.chosen ? `<div><span class="muted">20.11. 12.40</span><span>Mari Virtanen valitsi urakoitsijan</span></div>` : ''}
    </div></section>`;
}

/* ---------- Piirto ja tapahtumat ---------- */
function render() {
  pressed('roleSeg', 'role', S.role);
  pressed('timeSeg', 'after', S.after ? 1 : 0);
  renderSide();
  const t = tenders.find(x => x.id === S.tender);
  const main = document.getElementById('main');
  if (S.role === 'board') {
    if (S.view === 'new') { main.innerHTML = wizard(); return; }
    if (t.status !== 'live') { main.innerHTML = boardDetail(t); return; }
    const tabs = [['detail', 'Kilpailutus'], ['compare', 'Vertailu'], ['folder', 'Hankekansio']];
    const done = folderTasks().flatMap(p => p[1]).filter(x => x[1] === 'done').length;
    main.innerHTML = `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${S.view === k}">${l}${k === 'folder' ? `<span class="count">${done}/19</span>` : ''}</button>`).join('')}</div>`
      + (S.view === 'compare' ? compareView(t) : S.view === 'folder' ? folderView(t) : boardDetail(t));
  }
  else if (S.role === 'contractor') main.innerHTML = contractorView();
  else main.innerHTML = adminView();
}

function readBid() {
  const v = id => document.getElementById(id);
  if (!v('b-price')) return;
  Object.assign(S.bidDraft, { price: v('b-price').value, warranty: v('b-war').value, start: v('b-start').value, end: v('b-end').value, note: v('b-note').value, refs: v('b-refs').value, tv: v('b-tv').checked });
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.role) { readBid(); S.role = b.dataset.role; S.toast = ''; S.view = 'detail'; return render(); }
  if (b.dataset.after !== undefined) { readBid(); S.after = b.dataset.after === '1'; S.toast = ''; S.confirming = null; if (!S.after) { S.chosen = null; S.memo = false; } return render(); }
  if (b.dataset.tender) { S.tender = +b.dataset.tender; S.view = 'detail'; S.toast = ''; return render(); }
  if (b.dataset.choose) { S.confirming = b.dataset.choose; return render(); }
  if (b.dataset.tab) { S.view = b.dataset.tab; S.toast = ''; return render(); }
  if (b.dataset.doc) { S.doc = b.dataset.doc; return render(); }
  if (b.dataset.wtype) { S.wizType = b.dataset.wtype; return render(); }
  const act = b.dataset.act;
  const acts = {
    new: () => { S.view = 'new'; S.wizStep = 0; },
    back: () => { S.view = 'detail'; S.tender = S.tender || 1; },
    compare: () => { S.view = 'compare'; },
    memo: () => { S.memo = !S.memo; },
    wnext: () => { S.wizStep = Math.min(3, S.wizStep + 1); },
    wprev: () => { S.wizStep = Math.max(0, S.wizStep - 1); },
    confirmChoose: () => { S.chosen = S.confirming; S.confirming = null; S.toast = 'Urakoitsija valittu. Tarjoajat saavat tiedon sähköpostilla.'; },
    cancelChoose: () => { S.confirming = null; },
    withdraw: () => { readBid(); S.myBid = null; S.toast = 'Tarjous peruttu. Voit jättää uuden tarjouksen määräpäivään asti.'; },
  };
  if (acts[act]) { acts[act](); render(); }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'bidForm') {
    readBid();
    const ok = /^\d[\d\s]*([.,]\d{1,2})?$/.test(S.bidDraft.price.trim()) && parseFloat(S.bidDraft.price.replace(/\s/g, '').replace(',', '.')) > 0;
    S.toast = !ok ? '' : S.myBid ? 'Tarjous päivitetty.' : `Tarjous jätetty. Voit muokata sitä ${DEADLINE} asti.`;
    if (!ok) { const el = document.getElementById('b-price'); el.setCustomValidity('Anna hinta euroina, esim. 412000 tai 412 000,00'); el.reportValidity(); el.setCustomValidity(''); return; }
    S.myBid = true; render();
  }
  if (e.target.id === 'askForm') { S.asked = true; render(); }
});

document.addEventListener('input', e => {
  if (e.target.id !== 'b-price') return;
  const p = parseFloat(e.target.value.replace(/\s/g, '').replace(',', '.')) || 0;
  document.getElementById('s0').textContent = eur(p);
  document.getElementById('s1').textContent = eur(p * VAT);
  document.getElementById('s2').textContent = eur(p * (1 + VAT));
});

render();
</script>
</body></html>
